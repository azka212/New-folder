<html>

<head>
    <title>
        use of grids
    </title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>

<body>
    <h1>
        column grids
    </h1>
    <div class="container">
        <div class="row">
            <div class="col">
                column 1
            </div>
            <div class="col">
                column 2
            </div>
            <div class="col">
                column 3
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <h3>
                extra small
            </h3>
            <div class="col-xs-2 col-md-2" style="background-color: yellow; border: 1px solid black;">
                col-xs-2
            </div>
            <div class="col-xs-3 col-md-3" style="background-color: red; border: 1px solid black;">
                col-xs-3
            </div>
            <div class="col-xs-4 col-md-4" style="background-color: brown; border: 1px solid black;">
                col-xs-4
            </div>
            <div class="col-xs-5 col-md-5" style="background-color: blue; border: 1px solid black;">
                col-xs-5
            </div>
            <div class="col-xs-6 col-md-6" style="background-color: purple; border: 1px solid black;">
                col-xs-6
            </div>
            <div class="col-xs-7 col-md-7" style="background-color: chartreuse; border: 1px solid black;">
                col-xs-7
            </div>
            <div class="col-xs-8 col-md-8" style="background-color: aqua; border: 1px solid black ;">
                col-xs-8
            </div>
            <div class="col-xs-9 col-md-9" style="background-color: chocolate; border: 1px solid black;">
                col-xs-9
            </div>
            <br>
            <h3>
                extra large
            </h3>
            <div class="col-md-2 col-xl-2" style="background-color: yellow; border: 1px solid black;">
                col-md-2
            </div>
            <div class="col-md-3 col-xl-3" style="background-color: yellowgreen; border: 1px solid black;">
                col-md-3
            </div>
            <diV class="col-md-4 col-xl-4" style="background-color: blue; border: 1px solid black;">
                col-md-4
            </diV>
            <diV class="col-md-5 col-xl-5" style="background-color: pink; border: 1px solid black;">
                col-md-5
            </diV>
            <diV class="col-md-6 col-xl-6" style="background-color: red; border: 1px solid black;">
                col-md-6
            </diV>
            <diV class="col-md-7 col-xl-7" style="background-color: violet; border: 1px solid black;">
                col-md-7
            </diV>
            <diV class="col-md-8 col-xl-8" style="background-color: purple; border: 1px solid black;">
                col-md-8
            </diV>
            <diV class="col-md-9 col-xl-9" style="background-color: cyan; border: 1px solid black;">
                col-md-9
            </diV>

        </div>
    </div>
</body>
<style>
    .col {
        background-color: burlywood;
        border: 2px solid brown;
        text-align: center;
    }
</style>

</html>
