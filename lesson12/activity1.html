<html>

<head>
    <title>
        activity 1
    </title>
</head>

<body>
    <h1>positions</h1>
    <div class="sticky">
        div with sticky property
    </div>
    <div class="relative">
        div with relative property
    </div>
    <div class="absolute">
        div with absolute property
    </div>
    <div class="fixed">
        div with fixed property
    </div>
    <div>
        div with no property
    </div>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <style>
        div {
            right: 30px;
            border: 3px solid black;
        }

        .absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
            top: 200px;
        }

        .relative {
            position: relative;
            left: 100px;
            border: 3px solid red;
        }

        .fixed {
            position: fixed;
            top: 0;
            right: 20px;
            width: 300px;
            border: 3px solid green;
        }

        .sticky {
            position: sticky;
            top: 1px;
            left: 20px;
            width: 100px;
            border: 3px solid yellow;
        }
    </style>
</body>

</html>
