<html>

<body>

        opacity 0.4
    </div>

    <div class="three" style=" background-color: blue; padding: 10px;">
        opacity 0.8
    </div>

    <div class="four" style=" background-color: blue; padding: 10px;">
        opacity 1
    </div>
    <div>
        div with no property
    </div>
    <br>
    <div class="relative">
        relative property
    </div>
    <br>
    <div class="absolute">

</body>
<style>
   
    .one {
        opacity: 0.2;
    }

    .two {
        opacity: 0.4;
    }

    .three {
        opacity: 0.8;
    }

    .four {
        opacity: 1;
    }
    .absolute{
        position: absolute;
        background-color: yellow;
        border: 3px solid black;
    }
    .relative{
        position: relative;
        background-color: red;
        border: 3px solid black;
    }
    .fixed{
        position: fixed;
        background-color: brown;
        border: 3px solid black;
    }
    .sticky{
        position: sticky;
        background-color: blueviolet;
        border: 3px solid black;
        right: 200px;
        width: 300px;
    }
</style>
