<!DOCTYPE html>
<html>
    <head>
        <title>activity2</title>
    </head>
    <body>
        <form oninput="x.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">
            <fieldset>
                <legend>
                    average calculation
                </legend>
                <input id="m1" type="number">
                <input id="m2" type="number">
                <input id="m3" type="number">
                <p>Average: <output name="x" for="m1 m2 m3"></output></p>

            </fieldset>
        </form>
    </body>
</html>
